packages:
  - apps/*
  - packages/*

# Expo / React Native needs a flat node_modules
nodeLinker: hoisted

# pnpm 11: dependencies allowed to run install scripts
allowBuilds:
  esbuild: true
  sharp: true
  tesseract.js: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - expo-speech-recognition@58.0.1
